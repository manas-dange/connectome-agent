name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  research-tests:
    name: Research Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r research/requirements.txt
        pip install pytest pytest-cov flake8

    - name: Lint Python sources
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 research/src backend --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Pytest suite
      run: |
        PYTHONPATH=. pytest research/tests -v --cov=research/src

  web-build:
    name: Web Demo Build (Node 18)
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install web dependencies
      working-directory: web
      run: npm install

    - name: Build production bundle
      working-directory: web
      run: npm run build

    - name: Verify build artifacts
      run: |
        test -f web/dist/index.html
        echo "Production bundle verified!"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: web/dist/
